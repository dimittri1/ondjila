<!doctype html>
<html lang="pt"><head><meta charset="utf-8">
<title>Ondjila — folha de captura</title>
<style>
  :root{
    --bg:#fbfaf7; --panel:#fff; --ink:#151a24; --ink2:#3f4757; --ink3:#77808f;
    --line:#e2ded6; --gold:#b8860b; --goldbg:#fdf8ec; --goldln:#f0e2bd;
    --red:#c2410c; --green:#1a7f4b;
  }
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);
       font:15px/1.6 "Segoe UI",-apple-system,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  /* cada folha e exactamente 1200x800 = 3:2, o racio que o Devpost pede */
  .sheet{width:1200px;height:800px;padding:54px 60px;position:relative;overflow:hidden;
         background:var(--bg);display:flex;flex-direction:column}
  .kicker{color:var(--gold);font-size:11px;letter-spacing:.22em;text-transform:uppercase;margin:0 0 14px;font-weight:600}
  h1{font-family:Georgia,serif;font-weight:400;font-size:40px;margin:0 0 10px;line-height:1.15}
  .sub{color:var(--ink2);font-size:17px;margin:0 0 26px;max-width:88ch}
  .term{background:#0f1420;color:#d7dce8;border-radius:9px;padding:22px 26px;
        font-family:ui-monospace,Consolas,monospace;font-size:12.5px;line-height:1.62;
        white-space:pre;overflow:hidden;flex:1;box-shadow:0 12px 34px -18px rgba(19,32,67,.5)}
  .term .g{color:#4ade80} .term .r{color:#fb7185} .term .y{color:#fbbf24}
  .term .d{color:#64748b} .term .w{color:#fff;font-weight:600}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:22px;flex:1}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:24px 26px;
        box-shadow:0 8px 24px -16px rgba(19,32,67,.3);display:flex;flex-direction:column}
  .card.bad{border-color:var(--red);background:#fff8f5}
  .card.good{border-color:var(--gold);background:var(--goldbg)}
  .card h3{margin:0 0 4px;font-size:15px;letter-spacing:.03em}
  .card .tag{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;margin:0 0 14px}
  .bad .tag{color:var(--red)} .good .tag{color:var(--gold)}
  .quote{font-size:19px;line-height:1.55;color:var(--ink)}
  .meta{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);color:var(--ink3);font-size:12.5px}
  table{width:100%;border-collapse:collapse;font-size:14.5px}
  th{text-align:left;color:var(--ink3);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
     padding:0 14px 12px 0;font-weight:600;border-bottom:1px solid var(--line)}
  td{padding:13px 14px 13px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
  tr.hi td{background:var(--goldbg);font-weight:600}
  tr.out td{color:var(--ink3);text-decoration:line-through;text-decoration-color:var(--red)}
  .foot{position:absolute;left:60px;right:60px;bottom:26px;display:flex;justify-content:space-between;
        color:var(--ink3);font-size:11.5px;border-top:1px solid var(--line);padding-top:14px}
  .foot b{color:var(--ink2);font-weight:600}
  .big{font-size:56px;font-weight:600;color:var(--gold);letter-spacing:-.02em;line-height:1}
  .stat{display:flex;gap:44px;margin:8px 0 26px}
  .stat div span{display:block;color:var(--ink3);font-size:13px;margin-top:6px}
</style></head>
<body>
<div class="sheet" id="sheet"></div>
<script>
// As folhas sao geradas a partir de dados REAIS medidos, nao de texto inventado.

"07-bakeoff": `
  <p class="kicker">Escolha do modelo base — medido, não estimado</p>
  <h1>Quatro candidatos, condições idênticas</h1>
  <p class="sub"><code>llama-bench -p 512 -n 128 -ngl 0 -t 4 -r 3 --load-mode mlock</code> — o mesmo comando que o profiler oficial corre.</p>
  <table>
    <tr><th>Modelo</th><th>Ficheiro</th><th>Prefill t/s</th><th>Geração t/s</th><th>Pico RAM</th></tr>
    <tr><td>Qwen3-1.7B</td><td>1,1 GB</td><td>10,31</td><td>2,78</td><td>1,19 GB</td></tr>
    <tr class="hi"><td>Qwen3.5-2B &nbsp;← escolhido</td><td>1,2 GB</td><td>16,81</td><td>2,67</td><td>1,35 GB</td></tr>
    <tr><td>Granite-4.1-3B</td><td>2,0 GB</td><td>9,67</td><td>3,17</td><td>2,10 GB</td></tr>
    <tr class="out"><td>Qwen3.5-4B</td><td>2,6 GB</td><td>9,62</td><td>1,91</td><td>2,78 GB</td></tr>
  </table>
  <p class="sub" style="margin-top:24px;font-size:15px">
    A geração fica quase empatada porque num CPU sem AVX2 ela é limitada pelo cálculo, não pela memória.
    O que discrimina é o prefill — e num ciclo de agente o prefill domina, porque o prompt de sistema
    é reenviado a cada turno. O modelo de 4B fica de fora: falha a referência de velocidade.</p>`,

"09-gbnf": `
  <p class="kicker">O núcleo técnico</p>
  <h1>Uma gramática diferente por cada estado</h1>
  <p class="sub">Compilada a partir do esquema do estado. O modelo fica fisicamente incapaz de emitir uma transição ilegal.</p>
  <div class="term"><span class="d"># state: ao.identidade.parents_documented
# generated by ondjila engine.grammar -- do not edit by hand</span>

<span class="y">root</span> ::= "{" ws "<span class="w">\\"parents_have_id\\"</span>" ws ":" ws val-parents-have-id ws
         "," ws "<span class="w">\\"birth_year\\"</span>" ws ":" ws val-birth-year ws
         "," ws "<span class="w">\\"next\\"</span>" ws ":" ws transition ws "}"

<span class="y">transition</span> ::= "\\"ao.identidade.route_standard\\""
             | "\\"ao.identidade.route_late\\""
             | "\\"__abstain__\\""

<span class="y">val-parents-have-id</span> ::= "\\"ambos\\"" | "\\"apenas_mae\\"" | "\\"apenas_pai\\""
                      | "\\"nenhum\\"" | "\\"nao_sei\\""
<span class="y">val-birth-year</span> ::= [0-9]{1,4}

<span class="d">ws ::= [ \\t\\n]*</span>

<span class="d">─────────────────────────────────────────────────────────────────
 Trabalho anterior restringe a descodificacao (Outlines, XGrammar)
 OU o fluxo de controlo (LangGraph, Burr). Nao os dois ao mesmo
 tempo. Aqui a gramatica sai do proprio fluxo, estado a estado.</span></div>`,
